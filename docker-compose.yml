version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: medroute-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medroute
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medroute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medroute -d medroute"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medroute-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medroute-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://medroute:password@db:5432/medroute
      - DATABASE_URL_SYNC=postgresql+psycopg2://medroute:password@db:5432/medroute
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8081"]
      - SEED_ON_STARTUP=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: medroute-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=Med Route
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
