# ──────────────────────────────────────────────
# docker-compose.yml — Med Route Full Stack
# ──────────────────────────────────────────────
# Start everything with: docker-compose up -d
# Stop with: docker-compose down
# Reset DB: docker-compose down -v
# ──────────────────────────────────────────────

version: "3.9"

services:

  # ── PostgreSQL 16 with PostGIS 3.4 ──────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: medroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medroute
      POSTGRES_USER: medroute
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medroute -d medroute"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis 7 ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medroute-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── FastAPI Backend ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: medroute-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://medroute:${DB_PASSWORD:-password}@postgres:5432/medroute
      DATABASE_URL_SYNC: postgresql+psycopg2://medroute:${DB_PASSWORD:-password}@postgres:5432/medroute
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: '["http://localhost:3000", "https://med-route.vercel.app"]'
      SEED_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Next.js Web App ───────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: medroute-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_APP_NAME: "Med Route"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

# ── Persistent Volumes ────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
