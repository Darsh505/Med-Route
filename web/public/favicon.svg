<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="fav-plum-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E3B95" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="fav-teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="fav-rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7EFF9" />
    </linearGradient>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#581C87" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="76" height="76" rx="20" fill="url(#fav-bg)" stroke="#E5D5E8" stroke-width="2" />

  <!-- Medical Cross & Waypoint Petals -->
  <g filter="url(#fav-shadow)">
    <!-- Left: Teal -->
    <path d="M 22 40 C 22 34 27 29 33 29 C 39 29 40 33 40 40 C 40 47 35 51 29 51 C 25 51 22 46 22 40 Z" fill="url(#fav-teal-grad)" />
    <!-- Top: Plum -->
    <path d="M 40 22 C 46 22 51 27 51 33 C 51 39 47 40 40 40 C 33 40 29 35 29 29 C 29 25 34 22 40 22 Z" fill="url(#fav-plum-grad)" />
    <!-- Bottom: Deep Violet -->
    <path d="M 40 58 C 34 58 29 53 29 47 C 29 41 33 40 40 40 C 47 40 51 45 51 51 C 51 55 46 58 40 58 Z" fill="url(#fav-plum-grad)" />
    <!-- Right: Rose -->
    <path d="M 58 40 C 58 46 53 51 47 51 C 41 51 40 47 40 40 C 40 33 45 29 51 29 C 55 29 58 34 58 40 Z" fill="url(#fav-rose-grad)" />
    <!-- Center Core -->
    <circle cx="40" cy="40" r="5" fill="#FFFFFF" />
    <circle cx="40" cy="40" r="2.5" fill="#581C87" />
  </g>
  <!-- Route Indicator -->
  <circle cx="61" cy="23" r="3.5" fill="#FB7185" />
</svg>
