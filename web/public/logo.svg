<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none" role="img" aria-label="MedRoute Logo">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mr-plum-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E3B95" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <linearGradient id="mr-teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="mr-rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <linearGradient id="mr-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A3E85" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <filter id="mr-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#581C87" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ================= EMBLEM (Left: 0..80) ================= -->
  <g transform="translate(10, 10)">
    <!-- Ambient Backdrop Squircle -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#mr-glow)" />
    <rect x="0.5" y="0.5" width="79" height="79" rx="21.5" stroke="#E5D5E8" stroke-width="1" />

    <!-- Cross & Route Loop Group -->
    <g filter="url(#mr-shadow)">
      <!-- Left Petal / Route Inflow (Teal) -->
      <path d="M 22 40 C 22 34 27 29 33 29 C 39 29 40 33 40 40 C 40 47 35 51 29 51 C 25 51 22 46 22 40 Z" 
            fill="url(#mr-teal-grad)" />

      <!-- Top Petal / Waypoint Beacon Loop (Plum) -->
      <path d="M 40 22 C 46 22 51 27 51 33 C 51 39 47 40 40 40 C 33 40 29 35 29 29 C 29 25 34 22 40 22 Z" 
            fill="url(#mr-plum-grad)" />

      <!-- Bottom Petal / Triage Anchor (Plum-Violet) -->
      <path d="M 40 58 C 34 58 29 53 29 47 C 29 41 33 40 40 40 C 47 40 51 45 51 51 C 51 55 46 58 40 58 Z" 
            fill="url(#mr-plum-grad)" />

      <!-- Right Petal / Active Route Outflow (Coral Rose) -->
      <path d="M 58 40 C 58 46 53 51 47 51 C 41 51 40 47 40 40 C 40 33 45 29 51 29 C 55 29 58 34 58 40 Z" 
            fill="url(#mr-rose-grad)" />

      <!-- Intersecting Central Route Bridge / Dynamic Ribbon Path -->
      <path d="M 24 40 C 32 30 48 30 56 40 C 48 50 32 50 24 40 Z" 
            fill="#FFFFFF" fill-opacity="0.3" />
      
      <!-- Core Pulse / Medical Waypoint Node -->
      <circle cx="40" cy="40" r="5" fill="#FFFFFF" />
      <circle cx="40" cy="40" r="2.5" fill="#581C87" />
    </g>

    <!-- Satellite Dynamic Waypoint Dots -->
    <circle cx="62" cy="24" r="3" fill="#FB7185" />
    <path d="M 58 28 L 52 34" stroke="#FB7185" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.6" />
  </g>

  <!-- ================= TYPOGRAPHY & WORDMARK ================= -->
  <!-- "MedRoute" Title -->
  <text x="104" y="52" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="-0.8">
    <tspan fill="#1E1226">Med</tspan>
    <tspan fill="#7A3E85">Route</tspan>
  </text>

  <!-- Tagline / Partner Subtitle -->
  <g transform="translate(106, 61)">
    <!-- MediBuddy Partner Capsule Badge -->
    <rect x="0" y="2" width="138" height="20" rx="10" fill="#FAF5FB" stroke="#E5D5E8" stroke-width="1" />
    <!-- Mini Partner Sparkle / Dot -->
    <circle cx="10" cy="12" r="3" fill="#7A3E85" />
    <text x="18" y="15.5" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          fill="#7A3E85" 
          letter-spacing="0.2">
      MediBuddy Partner
    </text>
    <text x="150" y="15.5" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" 
          font-weight="500" 
          fill="#8A7A90">
      • Transparent Care
    </text>
  </g>
</svg>
